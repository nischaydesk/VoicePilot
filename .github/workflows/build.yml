name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unpack Zip Files
      run: |
        find . -name "*.zip" -exec unzip -o {} +
        ls -la

    - name: Auto-fix Kotlin singleLine compilation error
      run: |
        # MainActivity.kt में मौजूद singleLine वाली त्रुटि को ऑटोमैटिक ठीक करना
        find . -name "MainActivity.kt" -exec sed -i 's/singleLine/maxLines = 1/g' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK
      run: |
        GRADLE_DIR=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
        cd "$GRADLE_DIR" && ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VoicePilot-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
