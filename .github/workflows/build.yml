name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unpack Zip Files
      run: |
        # रिपॉजिटरी में मौजूद किसी भी zip फ़ाइल को अपने-आप अनज़िप करेगा
        find . -name "*.zip" -exec unzip -o {} +
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK
      run: |
        if [ -d "android-native" ]; then
          cd android-native && ./gradlew assembleDebug --no-daemon
        elif [ -f "gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          # अगर ज़िप के अंदर किसी सबफ़ोल्डर में gradlew हो
          GRADLE_DIR=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$GRADLE_DIR" && ./gradlew assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VoicePilot-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
